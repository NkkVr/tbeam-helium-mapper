; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main

[env]
platform = espressif32@^3.5.0
board = ttgo-t-beam
framework = arduino
; NOTE: the LoRaWAN region (CFG_us915 / CFG_eu868 / CFG_au915) is NOT set here.
; MCCI LMIC bakes the region into the binary at compile time -- it cannot be
; switched at runtime -- so each leaf environment below picks exactly one region.
build_flags = -Wall
	-Wextra
	-Wno-missing-field-initializers -O3
	-D CFG_sx1276_radio=1
	-D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS
	-D ARDUINO_TTGO_LoRa32_V1

lib_deps =
	mcci-catena/MCCI LoRaWAN LMIC library@^4.1.1
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0
	lewisxhe/AXP202X_Library@^1.1.3
	mikalhart/TinyGPSPlus@^1.0.3

monitor_speed = 115200
; monitor_port = COM17
; upload_speed = 921600
; upload_port = COM17

; Default build -- US915, identical to the upstream base (no WiFi/BLE, default
; partition).  This is the safe, guaranteed-to-boot firmware.
[env:release]
build_flags = ${env.build_flags}
	-D CFG_us915=1

[env:debug]
build_flags = ${env.build_flags}
	-D CFG_us915=1
debug_build_flags =
    -D DEBUG
	-D LMIC_DEBUG_LEVEL=3

; Builds WITH the on-demand WiFi + BLE configuration portal, one per region.
; The portal needs a larger app partition because LMIC + WiFi + BLE exceed the
; default.  Pick the env that matches your country and flash it; the region is
; fixed in the binary (LMIC cannot switch it at runtime).
; Build/upload e.g.:  pio run -e portal_eu -t erase -t upload
; (do -t erase the first time, since the partition layout differs).
[env:portal_us]
build_flags = ${env.build_flags}
	-D CFG_us915=1
	-D ENABLE_CONFIG_PORTAL=1
board_build.partitions = huge_app.csv

[env:portal_eu]
build_flags = ${env.build_flags}
	-D CFG_eu868=1
	-D ENABLE_CONFIG_PORTAL=1
board_build.partitions = huge_app.csv

[env:portal_au]
build_flags = ${env.build_flags}
	-D CFG_au915=1
	-D ENABLE_CONFIG_PORTAL=1
board_build.partitions = huge_app.csv

; EXPERIMENTAL: RadioLib backend with runtime region selection chosen from the
; GPS location (see RADIOLIB_MIGRATION.md).  Replaces MCCI LMIC.  Needs hardware
; bring-up; the LMIC envs above remain the stable default.
; No CFG_xxx region define here -- the region is selected at runtime.
[env:portal_radiolib]
build_flags = ${env.build_flags}
	-D CFG_sx1276_radio=1
	-D ENABLE_CONFIG_PORTAL=1
	-D USE_RADIOLIB=1
; Deliberately does NOT inherit ${env.lib_deps}: the MCCI LMIC library fails to
; compile without a CFG_xxx region define, and this env selects region at runtime.
lib_deps =
	thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.3.0
	lewisxhe/AXP202X_Library@^1.1.3
	mikalhart/TinyGPSPlus@^1.0.3
	jgromes/RadioLib@^6.6.0
board_build.partitions = huge_app.csv
